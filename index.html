<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f3eb"><meta name="description" content="하루를 시작하는 응원 한 줄과 작은 그림 한 장."><title>하루 한 장, 나에게</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f3eb;color:#435b47;font-family:'Malgun Gothic',system-ui,sans-serif}header{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding:29px 28px;border-bottom:1px solid #e4e7da}.brand{font-size:14px;font-weight:600}.brand span{color:#d5ad5d;margin-right:9px}header small{color:#a1aa96;font:10px Georgia,serif;letter-spacing:.15em}main{max-width:1100px;margin:0 auto;padding:48px 28px 30px}.eyebrow{font-size:10px;letter-spacing:.18em;color:#8e9e83;margin:0 0 18px}.hero{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;align-items:center}.copy{padding:15px 0}h1{font-weight:500;font-size:clamp(28px,4vw,42px);letter-spacing:-.055em;line-height:1.7;word-break:keep-all;margin:18px 0 23px}.date{font-size:12px;color:#91a084}.greeting{font-size:13px;color:#8e9a84;line-height:1.9;word-break:keep-all;margin:0 0 26px}.image-wrap{padding:11px;background:#fffdf6;border:1px solid #e5e6d9;border-radius:21px;box-shadow:0 22px 65px #69735412}.hero img{width:100%;height:auto;display:block;border-radius:12px}.save{display:inline-block;border:1px solid #b9c8ad;color:#627d5b;text-decoration:none;border-radius:11px;padding:11px 18px;font-size:11px}.archive{margin-top:55px;padding-top:26px;border-top:1px solid #e1e4d7}.archive-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.archive h2{font-size:14px;font-weight:500;margin:0}.archive-top small{color:#98a58d;font-size:11px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}.past{background:#fffcf4;border:1px solid #e5e6db;border-radius:15px;padding:9px;cursor:pointer;text-align:left;color:inherit;font:inherit}.past img{display:block;width:100%;border-radius:8px}.past time{font-size:10px;color:#95a287;display:block;margin:13px 5px 8px}.past p{font-size:11px;line-height:1.8;margin:0 5px 7px;word-break:keep-all}.past[aria-pressed=true]{border-color:#9fb78e}.empty{text-align:center;padding:75px 10px;color:#8e9a84}.hidden{display:none!important}footer{font-size:10px;color:#a5ac9a;text-align:center;line-height:1.9;padding:30px 20px 40px}button:focus-visible,a:focus-visible{outline:3px solid #b8ce9c;outline-offset:4px}@media(max-width:700px){header{padding:22px}header small{font-size:8px}main{padding:30px 20px}.hero{display:flex;flex-direction:column;gap:18px}.copy{width:100%;padding:0}h1{font-size:28px;margin:11px 0 15px}.image-wrap{width:100%}.archive{margin-top:36px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><header><div class="brand"><span>✷</span>하루 한 장, 나에게</div><small>A LITTLE LIGHT, EVERY DAY</small></header><main><section class="hero" id="hero"><div class="copy"><p class="eyebrow" id="label">오늘, 나에게 건네는 한 줄</p><time class="date" id="date"></time><h1 id="message"></h1><p class="greeting" id="greeting"></p><a class="save" id="save" download>그림 한 장 간직하기 ↗</a></div><div class="image-wrap"><img id="picture" alt="응원 한 줄이 담긴 밝은 그림책 삽화" width="1254" height="1254"></div></section><section class="empty hidden" id="empty">새로운 하루의 응원을 준비하고 있어요.</section><section class="archive" id="archive"><div class="archive-top"><h2>차곡차곡 모인 마음</h2><small id="count"></small></div><div class="cards" id="cards"></div></section></main><footer>짧은 한마디와 작은 그림이, 오늘의 곁에.<br>하루 한 장, 나에게</footer><script>
const CARDS=[
  {
    "date": "2026-11-02",
    "image": "cards/2026-11-02.jpg",
    "message": "작은 한 걸음도, 오늘의 너를 앞으로 데려가."
  }
];
const $=id=>document.getElementById(id);
function koreanToday(now=new Date()){return new Date(now.getTime()+9*3600000).toISOString().slice(0,10)}
function pickToday(cards,now=new Date()){const date=koreanToday(now);return cards.find(c=>c.date===date)||cards.find(c=>c.date<date)||null}
let viewing=null;
function show(card){if(!card)return;viewing=card.date;const isToday=card.date===koreanToday();$('label').textContent=isToday?'오늘, 나에게 건네는 한 줄':'다시 펼쳐 보는 작은 응원';$('date').textContent=card.date.replaceAll('-','. ');$('date').dateTime=card.date;$('message').textContent=card.message;$('picture').src=card.image;$('picture').alt=card.message+' — 밝고 잔잔한 그림책 삽화';$('save').href=card.image;$('save').download='하루-한-장-'+card.date+'.jpg';$('greeting').textContent=isToday?'서두르지 않고, 오늘도 나의 속도로. 잠깐 쉬어 가며 이 한 장을 만나 보세요.':CARDS.some(c=>c.date===koreanToday())?'그날의 마음을, 오늘 다시 천천히 만나 보세요.':'오늘의 카드는 아직 도착하지 않았어요. 최근에 도착한 한 장을 먼저 펼쳐 둘게요.';for(const b of $('cards').children)b.setAttribute('aria-pressed',String(b.dataset.date===card.date))}
CARDS.sort((a,b)=>b.date.localeCompare(a.date));
if(!CARDS.length){$('hero').classList.add('hidden');$('archive').classList.add('hidden');$('empty').classList.remove('hidden')}else{for(const card of CARDS){const button=document.createElement('button');button.className='past';button.dataset.date=card.date;button.setAttribute('aria-pressed','false');const img=document.createElement('img');img.src=card.image;img.alt='';img.loading='lazy';const time=document.createElement('time');time.textContent=card.date;time.dateTime=card.date;const p=document.createElement('p');p.textContent=card.message;button.append(img,time,p);button.onclick=()=>{show(card);$('hero').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})};$('cards').append(button)}$('count').textContent=CARDS.length+'장의 응원';show(pickToday(CARDS));}
let knownDay=koreanToday();setInterval(()=>{if(knownDay!==koreanToday()){knownDay=koreanToday();show(pickToday(CARDS))}},60000);
</script></body></html>
